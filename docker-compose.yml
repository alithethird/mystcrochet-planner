services:
  mystcrochet-planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: mystcrochet-planner:latest
    container_name: mystcrochet-planner
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:80"
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
